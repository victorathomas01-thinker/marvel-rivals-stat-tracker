name: Verify extension

on:
  push:
    branches:
      - main
      - career-readiness/**
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run syntax checks and regression tests
        run: npm run verify

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --no-audit --no-fund
      - name: Install isolated Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Verify extension using synthetic pages in Chromium
        run: npm run test:browser
