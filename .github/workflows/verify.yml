name: Verify extension

on:
  push:
    branches:
      - main
      - career-readiness/**
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run syntax checks and regression tests
        run: npm run verify
